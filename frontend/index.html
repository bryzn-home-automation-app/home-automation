<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Home Screen app: full-screen, its own icon, and (iOS 16.4+) phone alerts. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HomeOS" />
    <!-- iOS draws a white clock on this bar; index.css backs it with ink in the light theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The light enamel; ThemeContext keeps it in step with the theme and app colour. -->
    <meta name="theme-color" content="#e9ecea" />
    <!--
      Paint the saved theme and app colour before the first frame. Without this the
      page drew the stylesheet's default until the JavaScript loaded and only then
      flipped, so a dark choice flashed light (and, before Faceplate, a light choice
      flashed navy). Mirrors ThemeContext: same localStorage keys, no choice = light,
      Auto = the theme it last showed (the sun maths lives in the bundle), Device = the
      phone's setting. The colour maths lives in the bundle too, so ThemeContext saves
      the derived tokens for both themes ('app-colour-tokens') and this paints them.
      A finish saved by an older build (no tokens yet) gets its colour's page tone,
      the only thing on screen before the bundle runs. themeBoot.test.tsx runs this
      script against ThemeProvider.
    -->
    <script id="theme-boot">
      (function () {
        var root = document.documentElement;
        function read(key) {
          try { return window.localStorage.getItem(key); } catch (e) { return null; }
        }
        function deviceDark() {
          try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; }
        }
        function hex(value) {
          var m = /^\s*#?([0-9a-f]{3}|[0-9a-f]{6})\s*$/i.exec(value || '');
          if (!m) return null;
          var s = m[1].toLowerCase();
          return '#' + (s.length === 3 ? s.charAt(0) + s.charAt(0) + s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) : s);
        }
        var mode = read('theme');
        var last = read('theme-resolved');
        var dark =
          mode === 'dark' ? true :
          mode === 'auto' ? (last ? last === 'dark' : deviceDark()) :
          mode === 'system' ? deviceDark() :
          false;
        var theme = dark ? 'dark' : 'light';
        root.setAttribute('data-theme', theme);
        var page = dark ? '#121416' : null;
        var colour = hex(read('app-colour'));
        if (colour) {
          var cached = null;
          try { cached = JSON.parse(read('app-colour-tokens')); } catch (e) { cached = null; }
          var tokens = cached && cached.hex === colour ? cached[theme] : null;
          if (tokens) {
            for (var name in tokens) {
              if (name.indexOf('--app') === 0 && typeof tokens[name] === 'string') root.style.setProperty(name, tokens[name]);
            }
            page = tokens['--appbg'] || page;
          }
        } else {
          // [light, dark] page tone of each old finish's preset colour (appColour.ts).
          var legacy = { ocean: ['#d8efff', '#001624'], sunset: ['#ffe7d4', '#220f00'], violet: ['#ede9ff', '#160f29'] };
          var keys = ['palette', 'palette-dark', 'palette-light'];
          for (var i = 0; i < keys.length; i++) {
            var tone = legacy.hasOwnProperty(read(keys[i])) ? legacy[read(keys[i])] : null;
            if (tone) {
              page = tone[dark ? 1 : 0];
              root.style.setProperty('--appbg', page);
              break;
            }
          }
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && page) meta.setAttribute('content', page);
      })();
    </script>
    <title>HomeOS</title>
  </head>
  <body class="bg-appbg text-apptext min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
