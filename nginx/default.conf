# HTTPS arrives via Tailscale (tailscale serve on the NUC terminates TLS for
# https://nuc.<tailnet>.ts.net and forwards here over plain HTTP). Keep the
# original scheme/host so the backend and go2rtc see the real origin; on direct
# HTTP these fall back to this request's own values.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}
map $http_x_forwarded_host $fwd_host {
    ""      $http_host;
    default $http_x_forwarded_host;
}

# Live HLS query: the master playlist gets the stream named by the ticket (never
# the client's); the playlist/segments keep go2rtc's own ?id=… session query.
map $cs_hls $cs_query {
    "stream.m3u8"  "src=$camera_stream&mp4";
    default        $args;
}

upstream backend {
    server backend:8080;
    # Reuse connections to Spring Boot instead of a new TCP handshake per API
    # call (Home alone makes ~15). Needs HTTP/1.1 + an empty Connection header below.
    keepalive 16;
}

server {
    # 80: the LAN address (http://192.168.4.228, the guest Wi-Fi included).
    # 8090: published on the NUC's 127.0.0.1 only (docker-compose.yml), so the only way to it is
    # tailscale serve once that points here: the tailnet's HTTPS address. Every request reaches
    # nginx from the same Docker gateway address and X-Forwarded-Proto is the client's to set, so
    # the port is the one reliable sign of where a request came from. The whole app is served on
    # both; only "Forgot password?" is limited to 8090 (below).
    listen 80;
    listen 8090;
    server_name localhost;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # API + Swagger + uploads → Spring Boot backend.
    # Every location that reaches the backend sets the forwarded headers itself. The backend's
    # ForwardedHeaderFilter (forward-headers-strategy: framework) takes the client address from an
    # RFC 7239 "Forwarded: for=" header first, then X-Forwarded-For's first entry, so a client's
    # own "Forwarded" header is dropped and X-Forwarded-For replaced, never appended to; otherwise
    # any client could name its own address and escape the per-address limits.
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_set_header Connection "";
    }

    # "Forgot password?" (a member's new Home password by birthday) only from the tailnet's HTTPS
    # address, i.e. port 8090 (see listen above); not from the LAN or the guest Wi-Fi. Elsewhere it
    # answers 404 with a note the sign-in page recognises. Same proxying as /api/.
    location = /api/auth/reset-password {
        default_type application/json;
        if ($server_port != 8090) {
            return 404 '{"error":"Password reset only works in the app at its secure address.","where":"https"}';
        }
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Bill PDFs are members-only (GET /api/bills/file). The backend no longer serves
    # this folder statically either; refusing it here too means a regression there
    # can't expose them again.
    location /uploads/bills/ {
        return 404;
    }

    location /swagger-ui/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /v3/api-docs {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Camera live view: /camera-stream/<ticket>/ws → the eufy bridge's go2rtc MSE
    # WebSocket. Browsers can't send a JWT on a WebSocket handshake, so a member gets
    # a 60-second ticket from POST /api/home/cameras/{id}/live and the backend checks
    # it here (auth_request), answering with the go2rtc stream name to open. The
    # client's query string is never forwarded — it can't pick another stream.
    # The stream runs only while the page holds the socket open; go2rtc stops the
    # camera when the last viewer leaves.
    location ~ ^/camera-stream/[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/ws$ {
        auth_request /_camera_stream_auth;
        auth_request_set $camera_stream $upstream_http_x_stream_src;

        # Resolved per request (Docker DNS), so nginx still starts when the eufy
        # profile is off and the bridge doesn't exist — live view just returns 502.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $eufy_go2rtc eufy-bridge:1984;
        proxy_pass http://$eufy_go2rtc/api/ws?src=$camera_stream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # go2rtc only accepts a WebSocket whose Origin matches Host, so pass the
        # browser's Host through rather than "eufy-bridge:1984".
        proxy_set_header Host $fwd_host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Camera live view over HLS — the iPhone path (Safari plays HLS natively; its
    # MediaSource path showed black tiles). Same ticket + auth_request as above.
    # Only the master playlist names the stream (src filled in from the ticket, never
    # the client); it points at hls/playlist.m3u8?id=… whose segments carry go2rtc's
    # own session id, so their query string is passed through. `mp4` = fMP4 HLS,
    # required for H.265.
    location ~ ^/camera-stream/[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/(?<cs_hls>stream\.m3u8|hls/(?:playlist\.m3u8|segment\.(?:ts|m4s)|init\.mp4))$ {
        auth_request /_camera_stream_auth;
        auth_request_set $camera_stream $upstream_http_x_stream_src;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $eufy_go2rtc eufy-bridge:1984;
        # $cs_query is a map (top of file), evaluated here at proxy time — after
        # auth_request has filled $camera_stream. A `set` would run before it.
        proxy_pass http://$eufy_go2rtc/api/$cs_hls?$cs_query;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location = /_camera_stream_auth {
        internal;
        proxy_pass http://backend/internal/camera-stream/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        # The subrequest carries the client's headers: the same forwarded-header rule as /api/.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Never serve the backend's internal routes from outside.
    location /internal/ {
        return 404;
    }

    # React SPA — static files with fallback to index.html
    root /usr/share/nginx/html;
    index index.html;

    # Prevent browser caching of index.html so deploys are always fresh
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # Home Screen app manifest: nginx's stock mime.types has no .webmanifest, and
    # served as octet-stream iOS ignores it. Not cached, like index.html.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Long cache for hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ES module workers (pdf.js, used by the bill viewer) need the correct
    # MIME type to be executed as a module — nginx's stock mime.types has no
    # entry for .mjs, so it falls back to application/octet-stream and the
    # browser refuses to run it, failing with "Failed to fetch dynamically
    # imported module". A regex location takes priority over the /assets/
    # prefix match above regardless of declaration order.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
