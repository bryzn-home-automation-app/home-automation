services:
  postgres:
    image: postgres:16-alpine
    container_name: homeplatform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homeplatform}
      POSTGRES_USER: ${POSTGRES_USER:-homeplatform}
      # No weak default — must be set in .env. Fails fast rather than shipping "changeme".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # Not published to the host: the backend reaches Postgres over the internal
    # Docker network by service name. Publishing 5432 exposed the DB to the whole
    # LAN (incl. the WiFi guest network) with app-layer auth fully bypassed.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: homeplatform-redis
    # Require a password and don't publish the port — same LAN-exposure reasoning
    # as Postgres. The backend authenticates via SPRING_REDIS_PASSWORD.
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: homeplatform-backend
    environment:
      TZ: America/Chicago
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-homeplatform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-homeplatform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      JWT_SECRET: ${JWT_SECRET}
      KWH_RATE: ${KWH_RATE:-0.12}
      GAS_UNIT_RATE: ${GAS_UNIT_RATE:-1.47}
      DATA_START_DATE: ${DATA_START_DATE:-07/24/2026}
      PROPERTY_LATITUDE: ${PROPERTY_LATITUDE}
      PROPERTY_LONGITUDE: ${PROPERTY_LONGITUDE}
      COSERV_USERNAME: ${COSERV_USERNAME}
      COSERV_PASSWORD: ${COSERV_PASSWORD}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN}
      GMAIL_WATER_BILL_LABEL: ${GMAIL_WATER_BILL_LABEL:-Water Bill}
      WATER_ACCOUNT_NUMBER: ${WATER_ACCOUNT_NUMBER}
      WATER_SERVICE_ADDRESS: ${WATER_SERVICE_ADDRESS}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-}
      GUEST_INVITE_CODE: ${GUEST_INVITE_CODE:-}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
      # Home Assistant — blank/false keeps the integration off (stack still boots).
      HA_ENABLED: ${HA_ENABLED:-false}
      HA_URL: ${HA_URL:-http://homeassistant:8123}
      HA_TOKEN: ${HA_TOKEN:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-homeplatform}
      POSTGRES_USER: ${POSTGRES_USER:-homeplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # Reached only through nginx (port 80). Not published to the host so the
    # API can't be hit directly, bypassing the same-origin reverse proxy.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
      - ./scripts:/scripts:ro
      - ./.git-commit:/app/.git-commit:ro

  roomba-poller:
    build:
      context: ./roomba-poller
      dockerfile: Dockerfile
    container_name: homeplatform-roomba-poller
    environment:
      TZ: America/Chicago
      # iRobot cloud credentials — no defaults; must be set in .env.
      IROBOT_EMAIL: ${IROBOT_EMAIL}
      IROBOT_PASSWORD: ${IROBOT_PASSWORD}
      IROBOT_COUNTRY: ${IROBOT_COUNTRY:-US}
      IROBOT_ROBOT_BLID: ${IROBOT_ROBOT_BLID:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      # Same Postgres wiring the backend receives.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-homeplatform}
      POSTGRES_USER: ${POSTGRES_USER:-homeplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # Outbound-only (iRobot cloud + internal Postgres). No host ports.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Home Assistant (Container install) — the smart-home integration layer the backend
  # talks to (ecobee now, Eufy later). Runs here rather than as a VM because the NUC is
  # Windows 11 Home (no Hyper-V) and VirtualBox on the WSL2 hypervisor was CPU-starved.
  # No add-on store and no LAN discovery in this mode; fine for cloud integrations
  # like ecobee. Pinned version — bump deliberately, HA's backups live in the volume.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.2
    container_name: homeplatform-homeassistant
    environment:
      TZ: America/Chicago
    volumes:
      - ha_config:/config
    # Published so the HA UI is reachable on the LAN (setup, integrations). HA has its
    # own login; the backend uses the internal URL http://homeassistant:8123.
    ports:
      - "8123:8123"
    restart: unless-stopped

  # eufy-sdk bridge — logs into Eufy once and serves the cameras/HomeBase to HA's
  # eufy-sdk integration (custom_components/eufy_sdk in the ha_config volume) over
  # ws://eufy-bridge:3000/ws, with go2rtc bundled for video (RTSP 8554, API 1984).
  # Replaces eufy-security-ws, which broke when Eufy moved accounts to "Eufy Mega".
  #
  # Off by default: it only starts when .env sets COMPOSE_PROFILES=eufy (plus the
  # EUFY_* login), so the stack doesn't crash-loop a bridge with no account.
  # Use a dedicated Eufy account with the HomeBase shared to it — Eufy allows one
  # active login per account, so the bridge would log the phone app out otherwise.
  # Internal network only: HA reaches it by service name. Host networking (which
  # Docker Desktop on Windows can't really provide) is only needed for the bridge's
  # own WebRTC; HA streams from its RTSP instead.
  eufy-bridge:
    image: ghcr.io/mega-yfue/ha-eufy-sdk-bridge:0.6.0
    container_name: homeplatform-eufy-bridge
    profiles: ["eufy"]
    environment:
      TZ: America/Chicago
      # Not ":?"-required: compose interpolates every service even when its
      # profile is off, so a required var here would break every deploy.
      EUFY_EMAIL: ${EUFY_EMAIL:-}
      EUFY_PASSWORD: ${EUFY_PASSWORD:-}
      EUFY_COUNTRY: ${EUFY_COUNTRY:-US}
      # Battery live view runs up to 5 minutes in the app (BATTERY_LIVE_BUDGET_MS);
      # without these the SDK ends a battery stream at ~55 s and the bridge cuts one
      # with no motion at 5 min. Both sit just past the app's limit so it asks first.
      STREAM_BATTERY_BUDGET_MS: "330000"
      STREAM_IDLE_MS: "360000"
    volumes:
      # Login token, push registration and the generated go2rtc.yaml — keeps
      # restarts from re-prompting for 2FA.
      - eufy_data:/app/data
    expose:
      - "3000"
      - "1984"
      - "8554"
    restart: unless-stopped

  # Sits between go2rtc and the bridge's /stream feed and drops the outdoor
  # cameras' small warm-up frames, so live view starts at full size instead of
  # switching mid-stream (black/corrupt video). Points go2rtc at itself; see
  # eufy-gate/gate.mjs.
  eufy-gate:
    build: ./eufy-gate
    container_name: homeplatform-eufy-gate
    profiles: ["eufy"]
    environment:
      STATE_FILE: /data/full-sizes.json
    volumes:
      - eufy_gate_data:/data
    expose:
      - "3000"
    depends_on:
      - eufy-bridge
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_WIFI_SSID: ${VITE_WIFI_SSID}
        VITE_WIFI_PASSWORD: ${VITE_WIFI_PASSWORD}
    container_name: homeplatform-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  ha_config:
  eufy_data:
  eufy_gate_data:
