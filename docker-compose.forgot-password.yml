# "Forgot password?": a household member sets a new Home (Authelia) password with the birthday
# an admin saved for them in People (PasswordResetService, AutheliaUsersFile).
#
# Off unless this file is added to the project. On the NUC, in the root .env (Windows separates
# the files with ";"):
#   COMPOSE_FILE=docker-compose.yml;docker-compose.forgot-password.yml
# deploy-nuc.cmd runs plain `docker compose` from this folder, which reads COMPOSE_FILE from .env.
# Without this file the backend has no access to Authelia's data and the feature reports itself
# off; the stack starts on any machine, home-sso or not.
#
# The reset itself is answered only on nginx's port 8090 (the tailnet's HTTPS address, once
# tailscale serve points at 127.0.0.1:8090); see nginx/default.conf.
services:
  backend:
    environment:
      AUTHELIA_USERS_FILE: /authelia/users_database.yml
      # Authelia groups whose accounts can never be reset this way (comma-separated).
      AUTHELIA_ADMIN_GROUPS: ${AUTHELIA_ADMIN_GROUPS:-admin}
    volumes:
      # Authelia's data (../home-sso). The folder, not the one file: the new users file is
      # renamed into place, which a single-file mount can't take, and Authelia reloads on that
      # rename. The backend only touches users_database.yml and password-reset-backups/ in it.
      - authelia_data:/authelia

volumes:
  # Owned by ../home-sso (its scripts/import-users.sh created it). External, so nothing here can
  # create or delete it; compose refuses to start if it's missing.
  authelia_data:
    name: home-sso_authelia_data
    external: true
