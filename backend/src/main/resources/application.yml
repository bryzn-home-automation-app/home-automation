spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homeplatform}
    username: ${SPRING_DATASOURCE_USERNAME:homeplatform}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update    # auto-sync entities to tables (switch to validate + Flyway for prod)
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_REDIS_PASSWORD:}
  jackson:
    serialization:
      fail-on-empty-beans: false

app:
  kwh-rate: ${KWH_RATE:0.12}
  data-start-date: ${DATA_START_DATE:07/24/2026}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Logging
logging:
  level:
    com.homeplatform: DEBUG
