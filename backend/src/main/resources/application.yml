spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homeplatform}
    username: ${SPRING_DATASOURCE_USERNAME:homeplatform}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update    # auto-sync entities to tables (switch to validate + Flyway for prod)
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Dedicated scheduler pool so @Scheduled jobs run concurrently. Without this the
  # default pool size is 1, and a fast-cadence job could be head-of-line blocked
  # by a long-running one (e.g. a CoServ sync) on the shared thread.
  task:
    scheduling:
      pool:
        size: 4
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_REDIS_PASSWORD:}
  jackson:
    serialization:
      fail-on-empty-beans: false

app:
  kwh-rate: ${KWH_RATE:0.12}
  gas-unit-rate: ${GAS_UNIT_RATE:1.47}
  data-start-date: ${DATA_START_DATE:07/24/2026}
  property-latitude: ${PROPERTY_LATITUDE}
  property-longitude: ${PROPERTY_LONGITUDE}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  admin:
    seed-email: ${ADMIN_EMAIL:bryznnguyen@gmail.com}
    seed-username: ${ADMIN_USERNAME:bryzncode}
    seed-password: ${ADMIN_PASSWORD}
    seed-display-name: ${ADMIN_DISPLAY_NAME:Bryan}
  guest:
    # Guest check-in requires this shared code. Blank = guest login disabled.
    invite-code: ${GUEST_INVITE_CODE:}
  auth:
    # Family accounts sign in through home SSO only (Bryan, 2026-10-28). Password sign-in and
    # self-registration stay switchable for local dev and for emergencies (Authelia down);
    # docker-compose turns them off.
    password-login-enabled: ${PASSWORD_LOGIN_ENABLED:true}
  # Home SSO ("Sign in with Home", Authelia in ../home-sso). Off unless OIDC_ENABLED=true and
  # issuer + secret are set.
  oidc:
    enabled: ${OIDC_ENABLED:false}
    issuer: ${OIDC_ISSUER:}
    client-id: ${OIDC_CLIENT_ID:homeplatform}
    client-secret: ${OIDC_CLIENT_SECRET:}
    redirect-uri: ${OIDC_REDIRECT_URI:}
  security:
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
      window-minutes: ${LOGIN_WINDOW_MINUTES:15}
  # Home Assistant device layer (ecobee, Eufy). Active only when enabled AND url+token
  # are set; otherwise the integration disables itself and /api/home/* returns 503.
  home-assistant:
    enabled: ${HA_ENABLED:false}
    url: ${HA_URL:}
    token: ${HA_TOKEN:}
    request-timeout-seconds: ${HA_REQUEST_TIMEOUT_SECONDS:10}

server:
  port: 8080
  # Honor X-Forwarded-Proto/Host from nginx so a request that arrived as HTTPS via
  # Tailscale (tailscale serve -> nginx -> here over plain HTTP) is seen as
  # https://nuc.<tailnet>.ts.net. Without it, every POST from that origin looked
  # cross-origin and was refused by CORS. nginx sets these headers itself.
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html

# Logging
logging:
  level:
    com.homeplatform: DEBUG
