services:
  postgres:
    image: postgres:16-alpine
    container_name: homeplatform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homeplatform}
      POSTGRES_USER: ${POSTGRES_USER:-homeplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: homeplatform-redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homeplatform-backend
    environment:
      TZ: America/Chicago
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-homeplatform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-homeplatform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      KWH_RATE: ${KWH_RATE:-0.12}
      DATA_START_DATE: ${DATA_START_DATE:-07/24/2026}
      PROPERTY_LATITUDE: ${PROPERTY_LATITUDE}
      PROPERTY_LONGITUDE: ${PROPERTY_LONGITUDE}
      COSERV_USERNAME: ${COSERV_USERNAME}
      COSERV_PASSWORD: ${COSERV_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-homeplatform}
      POSTGRES_USER: ${POSTGRES_USER:-homeplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    expose:
      - "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
      - ./scripts:/scripts:ro

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: homeplatform-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
