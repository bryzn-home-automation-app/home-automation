services:
  postgres:
    image: postgres:16-alpine
    container_name: homeplatform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homeplatform}
      POSTGRES_USER: ${POSTGRES_USER:-homeplatform}
      # No weak default — must be set in .env. Fails fast rather than shipping "changeme".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # Not published to the host: the backend reaches Postgres over the internal
    # Docker network by service name. Publishing 5432 exposed the DB to the whole
    # LAN (incl. the WiFi guest network) with app-layer auth fully bypassed.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: homeplatform-redis
    # Require a password and don't publish the port — same LAN-exposure reasoning
    # as Postgres. The backend authenticates via SPRING_REDIS_PASSWORD.
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: homeplatform-backend
    environment:
      TZ: America/Chicago
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-homeplatform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-homeplatform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      JWT_SECRET: ${JWT_SECRET}
      KWH_RATE: ${KWH_RATE:-0.12}
      GAS_UNIT_RATE: ${GAS_UNIT_RATE:-1.47}
      DATA_START_DATE: ${DATA_START_DATE:-07/24/2026}
      PROPERTY_LATITUDE: ${PROPERTY_LATITUDE}
      PROPERTY_LONGITUDE: ${PROPERTY_LONGITUDE}
      COSERV_USERNAME: ${COSERV_USERNAME}
      COSERV_PASSWORD: ${COSERV_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-}
      GUEST_INVITE_CODE: ${GUEST_INVITE_CODE:-}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-homeplatform}
      POSTGRES_USER: ${POSTGRES_USER:-homeplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # Reached only through nginx (port 80). Not published to the host so the
    # API can't be hit directly, bypassing the same-origin reverse proxy.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
      - ./scripts:/scripts:ro
      - ./.git-commit:/app/.git-commit:ro

  roomba-poller:
    build:
      context: ./roomba-poller
      dockerfile: Dockerfile
    container_name: homeplatform-roomba-poller
    environment:
      TZ: America/Chicago
      # iRobot cloud credentials — no defaults; must be set in .env.
      IROBOT_EMAIL: ${IROBOT_EMAIL}
      IROBOT_PASSWORD: ${IROBOT_PASSWORD}
      IROBOT_COUNTRY: ${IROBOT_COUNTRY:-US}
      IROBOT_ROBOT_BLID: ${IROBOT_ROBOT_BLID:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      # Same Postgres wiring the backend receives.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-homeplatform}
      POSTGRES_USER: ${POSTGRES_USER:-homeplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # Outbound-only (iRobot cloud + internal Postgres). No host ports.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_WIFI_SSID: ${VITE_WIFI_SSID}
        VITE_WIFI_PASSWORD: ${VITE_WIFI_PASSWORD}
    container_name: homeplatform-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
