# HTTPS arrives via Tailscale (tailscale serve on the NUC terminates TLS for
# https://nuc.<tailnet>.ts.net and forwards here over plain HTTP). Keep the
# original scheme/host so the backend and go2rtc see the real origin; on direct
# HTTP these fall back to this request's own values.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}
map $http_x_forwarded_host $fwd_host {
    ""      $http_host;
    default $http_x_forwarded_host;
}

upstream backend {
    server backend:8080;
    # Reuse connections to Spring Boot instead of a new TCP handshake per API
    # call (Home alone makes ~15). Needs HTTP/1.1 + an empty Connection header below.
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # API + Swagger + uploads → Spring Boot backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace (do NOT append) any client-supplied X-Forwarded-For so the
        # backend can trust it. $proxy_add_x_forwarded_for appends to attacker
        # input, which lets a spoofed header defeat the login rate limiter.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Bill PDFs are members-only (GET /api/bills/file). The backend no longer serves
    # this folder statically either; refusing it here too means a regression there
    # can't expose them again.
    location /uploads/bills/ {
        return 404;
    }

    location /swagger-ui/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Camera live view: /camera-stream/<ticket>/ws → the eufy bridge's go2rtc MSE
    # WebSocket. Browsers can't send a JWT on a WebSocket handshake, so a member gets
    # a 60-second ticket from POST /api/home/cameras/{id}/live and the backend checks
    # it here (auth_request), answering with the go2rtc stream name to open. The
    # client's query string is never forwarded — it can't pick another stream.
    # The stream runs only while the page holds the socket open; go2rtc stops the
    # camera when the last viewer leaves.
    location ~ ^/camera-stream/[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/ws$ {
        auth_request /_camera_stream_auth;
        auth_request_set $camera_stream $upstream_http_x_stream_src;

        # Resolved per request (Docker DNS), so nginx still starts when the eufy
        # profile is off and the bridge doesn't exist — live view just returns 502.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $eufy_go2rtc eufy-bridge:1984;
        proxy_pass http://$eufy_go2rtc/api/ws?src=$camera_stream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # go2rtc only accepts a WebSocket whose Origin matches Host, so pass the
        # browser's Host through rather than "eufy-bridge:1984".
        proxy_set_header Host $fwd_host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location = /_camera_stream_auth {
        internal;
        proxy_pass http://backend/internal/camera-stream/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Never serve the backend's internal routes from outside.
    location /internal/ {
        return 404;
    }

    # React SPA — static files with fallback to index.html
    root /usr/share/nginx/html;
    index index.html;

    # Prevent browser caching of index.html so deploys are always fresh
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # Home Screen app manifest: nginx's stock mime.types has no .webmanifest, and
    # served as octet-stream iOS ignores it. Not cached, like index.html.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Long cache for hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ES module workers (pdf.js, used by the bill viewer) need the correct
    # MIME type to be executed as a module — nginx's stock mime.types has no
    # entry for .mjs, so it falls back to application/octet-stream and the
    # browser refuses to run it, failing with "Failed to fetch dynamically
    # imported module". A regex location takes priority over the /assets/
    # prefix match above regardless of declaration order.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
